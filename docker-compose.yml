services:
  app:
    build:
      context: .
      args:
        # Passed through so the public key is inlined at build time.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    image: apty
    restart: unless-stopped
    env_file: .env
    environment:
      # Absolute path inside the container's data volume.
      DATABASE_URL: file:/app/data/apty.db
    volumes:
      - apty-data:/app/data
    ports:
      # Optional: exposes the app on the LAN / for local testing. Cloudflare
      # reaches it over the internal network, so you can remove this in prod.
      - "3000:3000"

  # Zero-trust ingress: no open ports on your server, HTTPS handled by Cloudflare.
  # Create a tunnel in the Cloudflare dashboard, point its public hostname at
  # http://app:3000, and put the tunnel token in .env as CLOUDFLARE_TUNNEL_TOKEN.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  apty-data:
